    </g>
    <rect x="24" y="308" width="250" height="52" rx="14" fill="url(#accent)"/>
    <text x="72" y="342" fill="#fff" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="600">Установить</text>
    <path d="m213 333 9 0m-4-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
