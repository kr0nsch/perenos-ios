    <rect x="222" width="190" height="48" rx="14" fill="#e2eee6"/>
    <text x="242" y="31" class="text" font-size="17" font-weight="600">Открытый код</text>
    <rect x="428" width="175" height="48" rx="14" fill="#f2e3d8"/>
    <text x="448" y="31" class="text" font-size="17" font-weight="600">Бесплатно</text>
  </g>
  <g transform="translate(835 122) rotate(4 150 200)" filter="url(#shadow)">
    <rect width="298" height="392" rx="24" fill="#fff" stroke="#e1d9e9"/>
    <rect width="298" height="48" rx="24" fill="#f0edf5"/>
    <circle cx="23" cy="24" r="4" fill="#e8a198"/><circle cx="38" cy="24" r="4" fill="#e6c384"/><circle cx="53" cy="24" r="4" fill="#9bc5a6"/>
