    <rect x="24" y="105" width="250" height="33" rx="9" fill="#f2eff6"/>
    <g transform="translate(25 161)">
      <circle cx="13" cy="15" r="11" fill="#7053d9"/>
      <path d="m8 15 3 3 7-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="32" width="42" height="42" rx="12" fill="#e5dff8"/>
      <text x="89" y="18" class="text" font-size="15" font-weight="600">VK Музыка</text>
      <text x="89" y="38" class="muted" font-size="11">Ваша покупка</text>
      <path d="m227 12 6 6-6 6" fill="none" stroke="#8d7da5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(25 222)">
      <rect x="32" width="42" height="42" rx="12" fill="#e0edf0"/>
      <circle cx="13" cy="15" r="11" fill="none" stroke="#b7a7cc" stroke-width="1.5"/>
      <text x="89" y="18" class="text" font-size="15" font-weight="600">Авито</text>
      <text x="89" y="38" class="muted" font-size="11">Последняя версия</text>
