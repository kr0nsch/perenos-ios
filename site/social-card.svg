    <style>
      text { font-family: Manrope, 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: Consolas, monospace; }
      .name { font-size: 16px; font-weight: 650; fill: #101828; }
      .detail { font-size: 12px; fill: #667085; }
    </style>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#f5f8fc"/>
  <circle cx="1120" cy="90" r="330" fill="#2563eb" opacity=".055"/>
  <circle cx="1050" cy="640" r="210" fill="#2563eb" opacity=".035"/>
  <g transform="translate(58 47)"><rect width="54" height="54" rx="15" fill="url(#blue)"/><g fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 15V10a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v31a3 3 0 0 1-3 3h-8M19 38v6a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3h7"/><path d="M16 28h19m-6-6 6 6-6 6"/></g></g>
