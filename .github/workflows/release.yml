name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.7.2 (creates a draft release)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$version'" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Import code-signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "PERENOS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Build installer and portable ZIP
        shell: pwsh
        env:
          PERENOS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ./build/build.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Sign build provenance (Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/release/Perenos-*.exe
            artifacts/release/Perenos-*.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Perenos-${{ steps.version.outputs.value }}-windows
          path: artifacts/release/*

  release-macos:
    # Development DMGs are explicitly named -test.dmg. Only configured Developer ID
    # credentials produce the regular signed and notarized release filenames.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Ensure PowerShell
        run: command -v pwsh >/dev/null || brew install --cask powershell

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Invalid version" >&2; exit 1; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID and notarization credentials
        if: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/perenos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERT_PATH="$RUNNER_TEMP/perenos-developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then echo "No Developer ID Application certificate was found." >&2; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=PerenosCI" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials PerenosCI --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD"
          rm -f "$CERT_PATH"
          # Keep the temporary keychain for codesign and notarytool until the job ends.

      - name: Build macOS package (${{ matrix.rid }})
        run: |
          bash build/build-macos.sh ${{ steps.version.outputs.value }} ${{ matrix.rid }}
          mv artifacts/release/SHA256SUMS.txt "artifacts/release/SHA256SUMS-${{ matrix.rid }}.txt"

      - name: Mark development package and verify checksum
        run: |
          set -euo pipefail
          if [[ "${{ vars.MACOS_SIGNING_ENABLED }}" != "true" ]]; then
            ARCH="${{ matrix.rid }}"
            ARCH="${ARCH#osx-}"
            DMG="Perenos-${{ steps.version.outputs.value }}-macos-$ARCH.dmg"
            TEST_DMG="Perenos-${{ steps.version.outputs.value }}-macos-$ARCH-test.dmg"
            mv "artifacts/release/$DMG" "artifacts/release/$TEST_DMG"
            sed -i '' "s/$DMG/$TEST_DMG/" "artifacts/release/SHA256SUMS-${{ matrix.rid }}.txt"
          fi
          cd artifacts/release
          shasum -a 256 -c "SHA256SUMS-${{ matrix.rid }}.txt"

      - name: Sign macOS build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/release/*.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Perenos-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: artifacts/release/*

  publish:
    needs: [release-windows, release-macos]
    # Both Windows and the signed or explicitly marked test Mac packages must succeed.
    if: ${{ always() && needs.release-windows.result == 'success' && needs.release-macos.result != 'failure' && needs.release-macos.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Perenos-${{ needs.release-windows.outputs.version }}-*
          path: artifacts/release
          merge-multiple: true

      - name: Merge platform checksums
        shell: pwsh
        run: |
          $sums = Get-ChildItem artifacts/release -Filter 'SHA256SUMS*' | Get-Content | Sort-Object -Unique
          Get-ChildItem artifacts/release -Filter 'SHA256SUMS*' | Remove-Item
          [IO.File]::WriteAllLines("$PWD/artifacts/release/SHA256SUMS.txt", [string[]]$sums, [Text.UTF8Encoding]::new($false))

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ needs.release-windows.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          $notes = if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[|^\[\d' | Select-Object -First 1).LineNumber
            if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else { @("Перенос $version") }
          $ruDownloads = @(
            "- **Perenos-$version-setup-x64.exe** — установщик Windows (рекомендуется)",
            "- **Perenos-$version-portable-x64.zip** — портативная Windows-версия")
          $enDownloads = @(
            "- **Perenos-$version-setup-x64.exe** — Windows installer (recommended)",
            "- **Perenos-$version-portable-x64.zip** — portable Windows version")
          $signedMac = $false
          foreach ($arch in @("arm64", "x64")) {
            $platform = if ($arch -eq "arm64") { "Apple Silicon" } else { "Intel" }
            if (Test-Path "artifacts/release/Perenos-$version-macos-$arch.dmg") {
              $signedMac = $true
              $ruDownloads += "- **Perenos-$version-macos-$arch.dmg** — macOS на $platform, macOS 15+, подписано и нотаризовано"
              $enDownloads += "- **Perenos-$version-macos-$arch.dmg** — macOS on $platform, macOS 15+, signed and notarized"
            }
            if (Test-Path "artifacts/release/Perenos-$version-macos-$arch-test.dmg") {
              $ruDownloads += "- **Perenos-$version-macos-$arch-test.dmg** — тестовый macOS на $platform, macOS 15+, без Developer ID и нотаризации"
              $enDownloads += "- **Perenos-$version-macos-$arch-test.dmg** — test macOS on $platform, macOS 15+, ad-hoc signed and not notarized"
            }
          }
          $ruMacNotes = if (Test-Path "artifacts/release/*-test.dmg") {
            @("**Внимание для macOS:** файлы ``-test.dmg`` являются development-сборками с ad-hoc подписью, без Developer ID и нотаризации Apple. Gatekeeper может предупредить о неизвестном разработчике. Первый запуск на физическом Mac и операции с реальным iPhone не проверялись.")
          } else { @() }
          $enMacNotes = if (Test-Path "artifacts/release/*-test.dmg") {
            @("**macOS warning:** ``-test.dmg`` files are ad-hoc signed development builds, without Developer ID or Apple notarization. Gatekeeper may warn about an unidentified developer. First launch on a physical Mac and operations with a real iPhone have not been verified.")
          } else { @() }
          $ruMacTrust = if ($signedMac) { @("Mac DMG без суффикса ``-test`` подписаны Developer ID и нотаризованы Apple.") } else { @() }
          $enMacTrust = if ($signedMac) { @("Mac DMGs without the ``-test`` suffix are Developer ID-signed and notarized by Apple.") } else { @() }
          $body = @("### Скачать") + $ruDownloads + @("") + $ruMacNotes + $ruMacTrust + @(
            "Windows 10 версии 2004+ или Windows 11; для iPhone нужны «Устройства Apple» или iTunes.",
            "Файлы собраны GitHub Actions и имеют аттестацию происхождения Sigstore. Проверка: ``gh attestation verify <файл> -R ${{ github.repository }}``. Контрольные суммы — в ``SHA256SUMS.txt``. Аттестация не заменяет подпись Apple или издателя Windows.",
            "SmartScreen может предупредить о неизвестном издателе, если сертификат Windows не настроен.",
            "",
            "---",
            "") + @($notes) + @(
            "",
            "### Downloads") + $enDownloads + @("") + $enMacNotes + $enMacTrust + @(
            "Requires Windows 10 version 2004 or later, or Windows 11, and Apple Devices or iTunes.",
            "Built by GitHub Actions with signed Sigstore build provenance. Verify with ``gh attestation verify <file> -R ${{ github.repository }}``. Checksums are in ``SHA256SUMS.txt``. Attestation does not replace an Apple or Windows publisher signature.",
            "SmartScreen may warn about an unknown publisher if no Windows signing certificate is configured.")
          Set-Content -Path artifacts/release-notes.md -Value $body -Encoding utf8

      - name: Upload complete release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Perenos-${{ needs.release-windows.outputs.version }}
          path: artifacts/release/*

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.release-windows.outputs.version }}"
          [string[]] $files = Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName }
          [string[]] $mode = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "--draft", "--target", "${{ github.sha }}" } else { , "--verify-tag" }
          gh release create "v$version" $files --title "Перенос $version" --notes-file artifacts/release-notes.md $mode
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
