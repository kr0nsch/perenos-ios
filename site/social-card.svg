<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Перенос — приложения с iPhone на iPhone через Windows</title>
  <desc id="desc">Перенос приложений между iPhone и восстановление собственных покупок App Store. Бесплатная программа для Windows с открытым исходным кодом.</desc>
  <defs>
