name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: false

      - name: Build ipatool (checksum-verified source)
        shell: pwsh
        run: |
          ./build/Get-Ipatool.ps1 -RuntimeIdentifier win-x64
          ./build/Get-Ipatool.ps1 -RuntimeIdentifier win-arm64

      - name: Test
        run: dotnet test tests/Perenos.Core.Tests/Perenos.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Test view models and platform services
        run: dotnet test tests/Perenos.ViewModel.Tests/Perenos.ViewModel.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Test Avalonia UI
        run: dotnet test tests/Perenos.Ui.Tests/Perenos.Ui.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build app (x64)
        run: dotnet build src/Perenos/Perenos.csproj -c Release -r win-x64

      - name: Build app (ARM64)
        run: dotnet build src/Perenos/Perenos.csproj -c Release -r win-arm64

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install website test tools
        run: npm ci

      - name: Check website
        run: npm run test:site

  macos:
    # Use the Intel macOS runner to avoid GitHub's macOS arm64 queue starvation
    # while cross-compiling and packaging both osx-arm64 and osx-x64 in one job.
    runs-on: macos-15-intel
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: false

      - name: Build ipatool (checksum-verified source)
        shell: pwsh
        run: |
          ./build/Get-Ipatool.ps1 -RuntimeIdentifier osx-arm64
          ./build/Get-Ipatool.ps1 -RuntimeIdentifier osx-x64

      - name: Test cross-platform core
        run: dotnet test tests/Perenos.Core.Tests/Perenos.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Test view models and platform services
        run: dotnet test tests/Perenos.ViewModel.Tests/Perenos.ViewModel.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Test Avalonia UI
        run: dotnet test tests/Perenos.Ui.Tests/Perenos.Ui.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build and package macOS app (osx-arm64 and osx-x64)
        run: |
          command -v pwsh >/dev/null || brew install --cask powershell
          bash build/build-macos.sh 0.0.0 osx-arm64 osx-x64

      - name: Upload development packages for manual device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Perenos-ci-macos
          path: artifacts/release/*.dmg
          retention-days: 3
