name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.7.0 (creates a draft release)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$version'" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Import code-signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "PERENOS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Build installer and portable ZIP
        shell: pwsh
        env:
          PERENOS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ./build/build.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Sign build provenance (Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/release/Perenos-*.exe
            artifacts/release/Perenos-*.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Perenos-${{ steps.version.outputs.value }}-windows
          path: artifacts/release/*

  release-macos:
    # Ad-hoc development packages are built in CI. A public release requires signing and notarization.
    # Enable this variable only after configuring every Apple signing secret below.
    if: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Ensure PowerShell
        run: command -v pwsh >/dev/null || brew install --cask powershell

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Invalid version" >&2; exit 1; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID and notarization credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/perenos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERT_PATH="$RUNNER_TEMP/perenos-developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then echo "No Developer ID Application certificate was found." >&2; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=PerenosCI" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials PerenosCI --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD"
          rm -f "$CERT_PATH"
          # Keep the temporary keychain for codesign and notarytool until the job ends.

      - name: Build, sign and notarize ${{ matrix.rid }}
        run: |
          bash build/build-macos.sh ${{ steps.version.outputs.value }} ${{ matrix.rid }}
          mv artifacts/release/SHA256SUMS.txt "artifacts/release/SHA256SUMS-${{ matrix.rid }}.txt"

      - name: Sign macOS build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/release/*.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Perenos-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: artifacts/release/*

  publish:
    needs: [release-windows, release-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Perenos-${{ needs.release-windows.outputs.version }}-*
          path: artifacts/release
          merge-multiple: true

      - name: Merge platform checksums
        shell: pwsh
        run: |
          $sums = Get-ChildItem artifacts/release -Filter 'SHA256SUMS*' | Get-Content | Sort-Object -Unique
          Get-ChildItem artifacts/release -Filter 'SHA256SUMS*' | Remove-Item
          [IO.File]::WriteAllLines("$PWD/artifacts/release/SHA256SUMS.txt", [string[]]$sums, [Text.UTF8Encoding]::new($false))

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ needs.release-windows.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          $notes = if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[|^\[\d' | Select-Object -First 1).LineNumber
            if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else { @("Перенос $version") }
          $ruDownloads = @(
            "- **Perenos-$version-setup-x64.exe** — установщик Windows (рекомендуется)",
            "- **Perenos-$version-portable-x64.zip** — портативная Windows-версия")
          $enDownloads = @(
            "- **Perenos-$version-setup-x64.exe** — Windows installer (recommended)",
            "- **Perenos-$version-portable-x64.zip** — portable Windows version")
          if (Test-Path "artifacts/release/Perenos-$version-macos-arm64.dmg") {
            $ruDownloads += "- **Perenos-$version-macos-arm64.dmg** — macOS на Apple Silicon, macOS 15+"
            $enDownloads += "- **Perenos-$version-macos-arm64.dmg** — macOS on Apple Silicon, macOS 15+"
          }
          if (Test-Path "artifacts/release/Perenos-$version-macos-x64.dmg") {
            $ruDownloads += "- **Perenos-$version-macos-x64.dmg** — macOS на Intel, macOS 15+"
            $enDownloads += "- **Perenos-$version-macos-x64.dmg** — macOS on Intel, macOS 15+"
          }
          $body = @("### Скачать") + $ruDownloads + @(
            "",
            "Windows 10 версии 2004+ или Windows 11; для iPhone нужны «Устройства Apple» или iTunes. Mac-пакеты, если они есть в этом релизе, подписаны Developer ID и нотаризованы Apple.",
            "Файлы собраны GitHub Actions и имеют аттестацию происхождения Sigstore. Проверка: ``gh attestation verify <файл> -R ${{ github.repository }}``. Контрольные суммы — в ``SHA256SUMS.txt``.",
            "SmartScreen может предупредить о неизвестном издателе, если сертификат Windows не настроен.",
            "",
            "---",
            "") + @($notes) + @(
            "",
            "### Downloads") + $enDownloads + @(
            "",
            "Requires Windows 10 version 2004 or later, or Windows 11, and Apple Devices or iTunes. Any included Mac packages are Developer ID-signed and notarized by Apple.",
            "Built by GitHub Actions with signed Sigstore build provenance. Verify with ``gh attestation verify <file> -R ${{ github.repository }}``. Checksums are in ``SHA256SUMS.txt``.",
            "SmartScreen may warn about an unknown publisher if no Windows signing certificate is configured.")
          Set-Content -Path artifacts/release-notes.md -Value $body -Encoding utf8

      - name: Upload complete release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Perenos-${{ needs.release-windows.outputs.version }}
          path: artifacts/release/*

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.release-windows.outputs.version }}"
          [string[]] $files = Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName }
          [string[]] $mode = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "--draft", "--target", "${{ github.sha }}" } else { , "--verify-tag" }
          gh release create "v$version" $files --title "Перенос $version" --notes-file artifacts/release-notes.md $mode
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
