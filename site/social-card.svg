<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face{font-family:Manrope;src:url('fonts/manrope-cyrillic.woff2') format('woff2');font-weight:200 800}
      @font-face{font-family:Manrope;src:url('fonts/manrope-latin.woff2') format('woff2');font-weight:200 800}
      .text{font-family:Manrope,'Segoe UI',Arial,sans-serif;fill:#eef5fa}
      .muted{font-family:Manrope,'Segoe UI',Arial,sans-serif;fill:#b4c8df}
      .label{font-family:Manrope,'Segoe UI',Arial,sans-serif;fill:#64d2ff;font-size:16px;font-weight:600;letter-spacing:2px}
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102033"/><stop offset="1" stop-color="#1d3554"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".07"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071426" flood-opacity=".28"/></filter>
    <clipPath id="app-clip"><rect x="650" y="112" width="470" height="330" rx="16"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <image href="../assets/logo.png" x="70" y="66" width="54" height="54"/>
  <text x="140" y="107" class="text" font-size="34" font-weight="700" letter-spacing="-1.4">перенос</text>
  <text x="74" y="184" class="label">OPEN SOURCE · WINDOWS + MACOS</text>
  <text x="70" y="240" class="text" font-size="60" font-weight="650" letter-spacing="-3">Привычные</text>
  <text x="70" y="312" class="text" font-size="60" font-weight="650" letter-spacing="-3">приложения.</text>
  <text x="70" y="384" class="text" font-size="60" font-weight="650" letter-spacing="-3">На новом iPhone.</text>
  <text x="74" y="438" class="muted" font-size="22">Оригинальные IPA от Apple, по USB.</text>
  <text x="74" y="472" class="muted" font-size="22">Ваши покупки App Store, включая недоступные в РФ.</text>
  <g transform="translate(74 526)">
    <rect width="202" height="48" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="20" y="31" class="text" font-size="17" font-weight="600">Без джейлбрейка</text>
    <rect x="218" width="188" height="48" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="238" y="31" class="text" font-size="17" font-weight="600">Открытый код</text>
    <rect x="422" width="166" height="48" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="442" y="31" class="text" font-size="17" font-weight="600">Бесплатно</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="630" y="86" width="510" height="416" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".25"/>
    <image href="../docs/screenshots/avalonia/apps-ru-RU-Light.png" x="650" y="112" width="470" height="330" preserveAspectRatio="xMidYMid slice" clip-path="url(#app-clip)"/>
    <text x="650" y="476" class="muted" font-size="15">Демо приложения · реальная запись интерфейса</text>
  </g>
  <text x="690" y="552" class="muted" font-size="17">Перенос приложений и покупок между iPhone</text>
</svg>
