<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face{font-family:Manrope;src:url('fonts/manrope-cyrillic.woff2') format('woff2');font-weight:200 800}
      @font-face{font-family:Manrope;src:url('fonts/manrope-latin.woff2') format('woff2');font-weight:200 800}
      .text{font-family:Manrope,'Segoe UI',Arial,sans-serif;fill:#22202b}
      .muted{font-family:Manrope,'Segoe UI',Arial,sans-serif;fill:#71677f}
      .label{font-family:Manrope,'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:600;letter-spacing:2px}
    </style>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8def9"/><stop offset="1" stop-color="#f6f5f1" stop-opacity="0"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9274ec"/><stop offset="1" stop-color="#6546d3"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3e2e63" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#f6f5f1"/>
  <circle cx="1020" cy="280" r="310" fill="url(#orb)"/>
  <circle cx="1070" cy="535" r="116" fill="#dce9df" opacity=".55"/>
  <g transform="translate(70 62)">
    <rect width="52" height="52" rx="15" fill="url(#accent)"/>
    <rect x="14" y="10" width="24" height="32" rx="5" fill="none" stroke="#fff" stroke-width="2.5"/>
    <path d="M23 16h6M23 36h6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m31 24 7 5-7 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="38" class="text" font-size="33" font-weight="700" letter-spacing="-1.3">перенос</text>
  </g>
  <text x="74" y="182" class="label" fill="#7053d9">OPEN SOURCE · WINDOWS + MACOS</text>
  <text x="70" y="265" class="text" font-size="61" font-weight="650" letter-spacing="-3.2">Привычные приложения.</text>
  <text x="70" y="342" class="text" font-size="61" font-weight="650" letter-spacing="-3.2" fill="#7053d9">Новый iPhone.</text>
  <text x="74" y="397" class="muted" font-size="22">Ваши приложения и покупки App Store.</text>
  <text x="74" y="430" class="muted" font-size="22">Оригинальные IPA от Apple, по USB.</text>
  <g transform="translate(74 502)">
    <rect width="206" height="48" rx="14" fill="#e9e1f7"/>
