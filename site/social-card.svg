<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Перенос — новый iPhone, ваши приложения</title>
  <desc id="desc">Перенос приложений со старого iPhone на новый через Windows. Версия 1.3.0 с поиском недоступных в российском App Store приложений.</desc>
  <defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
  <rect width="1200" height="630" rx="24" fill="#f5f8fc"/><circle cx="1120" cy="90" r="330" fill="#2563eb" opacity=".055"/>
  <g transform="translate(58 47)"><rect width="54" height="54" rx="15" fill="url(#blue)"/><g fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 15V10a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v31a3 3 0 0 1-3 3h-8M19 38v6a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3h7"/><path d="M16 28h19m-6-6 6 6-6 6"/></g></g>
  <text x="129" y="86" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-1" fill="#101828">Перенос</text>
  <text x="60" y="165" font-family="Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#2563eb">ВЕРСИЯ 1.3.0  ·  WINDOWS 10 / 11</text>
  <text x="55" y="243" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-3" fill="#101828">Новый iPhone.</text>
  <text x="55" y="315" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-3" fill="#2563eb">Ваши приложения.</text>
  <text x="60" y="368" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="22" fill="#526078">Перенесите сейчас. Или сохраните на потом.</text>
  <rect x="60" y="413" width="229" height="54" rx="11" fill="#2563eb"/><text x="174" y="447" text-anchor="middle" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="white">Скачать для Windows</text>
  <text x="60" y="535" font-family="Consolas,monospace" font-size="12" letter-spacing=".8" fill="#526078">БЕСПЛАТНО  ·  ОТКРЫТЫЙ КОД  ·  БЕЗ ДЖЕЙЛБРЕЙКА</text>
  <rect x="688" y="134" width="458" height="391" rx="22" fill="#e6effe"/><rect x="708" y="154" width="418" height="351" rx="13" fill="white" stroke="#d5e0ee"/>
  <text x="732" y="194" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#101828">Приложения на старом iPhone</text>
  <rect x="732" y="214" width="370" height="40" rx="8" fill="#edf4ff"/><text x="917" y="239" text-anchor="middle" font-family="Manrope,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#2563eb">Только недоступные</text>
  <g font-family="Manrope,Segoe UI,Arial,sans-serif"><g><rect x="732" y="274" width="370" height="57" rx="9" fill="#f7faff"/><rect x="746" y="287" width="31" height="31" rx="9" fill="#4d8ef7"/><text x="791" y="299" font-size="14" font-weight="650" fill="#101828">Bloom Journal</text><text x="791" y="317" font-size="11" fill="#667085">Заметки и дневник</text></g>
  <g><rect x="732" y="342" width="370" height="57" rx="9" fill="#f7faff"/><rect x="746" y="355" width="31" height="31" rx="9" fill="#32a5b8"/><text x="791" y="367" font-size="14" font-weight="650" fill="#101828">Cloudy</text><text x="791" y="385" font-size="11" fill="#667085">Прогноз погоды</text></g>
  <g><rect x="732" y="410" width="370" height="57" rx="9" fill="#f7faff"/><rect x="746" y="423" width="31" height="31" rx="9" fill="#ee9b43"/><text x="791" y="435" font-size="14" font-weight="650" fill="#101828">Daily Planner</text><text x="791" y="453" font-size="11" fill="#667085">Планы на каждый день</text></g></g>
  <rect x="758" y="552" width="318" height="34" rx="17" fill="#eaf2ff"/><text x="917" y="574" text-anchor="middle" font-family="Consolas,monospace" font-size="10" letter-spacing=".4" fill="#2563eb">НОВОЕ: ПОИСК НЕДОСТУПНЫХ В РФ</text>
