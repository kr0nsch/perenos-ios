  <text x="522" y="77" text-anchor="middle" class="mono" font-size="12" fill="#2563eb">WINDOWS 10 / 11</text>
  <text x="60" y="168" class="mono" font-size="13" letter-spacing="1.2" fill="#2563eb">WINDOWS 10 / 11  ·  ОТКРЫТЫЙ КОД</text>
